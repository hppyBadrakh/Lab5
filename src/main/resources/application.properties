spring.application.name=ecommerce-order
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true

# --- Week 11 quality attributes (ADR-0008) ---
# Simulated third-party payment gateway. Load tests raise slow-call-ratio to reproduce scenario S2.
payment.gateway.latency=50ms
payment.gateway.slow-call-ratio=0.0
payment.gateway.slow-latency=5s
payment.gateway.read-timeout=3s
# false = unprotected baseline adapter (benchmarks only)
payment.resilience.enabled=true

# Circuit breaker around the PaymentPort (scenario S2)
resilience4j.circuitbreaker.instances.paymentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.instances.paymentService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.paymentService.register-health-indicator=true
# A full bulkhead is our own capacity decision, not a gateway failure: it must not trip the breaker
resilience4j.circuitbreaker.instances.paymentService.ignore-exceptions=io.github.resilience4j.bulkhead.BulkheadFullException

# Bulkhead: at most 25 request threads may wait for the gateway at the same time; no queueing
resilience4j.bulkhead.instances.paymentGateway.max-concurrent-calls=25
resilience4j.bulkhead.instances.paymentGateway.max-wait-duration=0

# Rate limiter on POST /api/v1/orders (scenario S3): 150 permits per second, no waiting
checkout.rate-limit.enabled=true
resilience4j.ratelimiter.instances.checkout.limit-for-period=150
resilience4j.ratelimiter.instances.checkout.limit-refresh-period=1s
resilience4j.ratelimiter.instances.checkout.timeout-duration=0

# Actuator: circuit breaker and rate limiter state for operations and evidence
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,ratelimiters,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
# Exposes tomcat.threads.busy, used by loadtest/LoadTest.java to show worker-thread exhaustion
server.tomcat.mbeanregistry.enabled=true
