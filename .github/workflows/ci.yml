name: CI

on:
  pull_request:
    branches: [m6-styles, m6-ddd]
  push:
    branches: [m6-styles, m6-ddd]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test-compile

  test-domain:
    name: Pure domain tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Pure domain tests run without booting Spring.
      - run: ./mvnw -B test -Dtest='*DomainTest,*AggregateTest,*ValueObjectTest'

  verify-architecture:
    name: Hexagonal architecture fitness
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # ArchUnit fails the build on any framework import in the domain or dependency pointing out of the hexagon.
      - run: ./mvnw -B test -Dtest=HexagonalArchitectureFitnessTest

  verify:
    name: Full verify
    needs: [test-domain, verify-architecture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B clean verify
