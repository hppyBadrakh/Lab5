name: CI

on:
  pull_request:
    branches: [m6-styles, m6-ddd, m7-distributed, m7-quality]
  push:
    branches: [m6-styles, m6-ddd, m7-distributed, m7-quality]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test-compile

  test-domain:
    name: Pure domain tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Pure domain tests run without booting Spring.
      - run: ./mvnw -B test -Dtest='*DomainTest,*AggregateTest,*ValueObjectTest'

  test-mitigations:
    name: Resilience and contract tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Circuit breaker, bulkhead and rate limiter behaviour, MockMvc contracts and the OpenAPI snapshot drift check.
      - run: ./mvnw -B test -Dtest='*Resilient*,*ContractTest'

  verify-architecture:
    name: Architecture fitness
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # ArchUnit: hexagon (ADR-0006), distributed slice (ADR-0007) and resilience placement (ADR-0008).
      - run: ./mvnw -B test -Dtest='*ArchitectureFitnessTest'

  verify:
    name: Full verify
    needs: [test-domain, test-mitigations, verify-architecture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B clean verify
