name: CI

on:
  pull_request:
    branches: [m6-styles, m6-ddd, m7-distributed]
  push:
    branches: [m6-styles, m6-ddd, m7-distributed]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test-compile

  test-domain:
    name: Pure domain tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Pure domain tests run without booting Spring.
      - run: ./mvnw -B test -Dtest='*DomainTest,*AggregateTest,*ValueObjectTest'

  test-contract:
    name: REST contract tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # MockMvc status, header and body checks, plus the OpenAPI snapshot drift check.
      - run: ./mvnw -B test -Dtest='*ContractTest'

  verify-architecture:
    name: Architecture fitness
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # ArchUnit: the hexagon rules (ADR-0006) and the distributed slice rules (ADR-0007).
      - run: ./mvnw -B test -Dtest='*ArchitectureFitnessTest'

  verify:
    name: Full verify
    needs: [test-domain, test-contract, verify-architecture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B clean verify
